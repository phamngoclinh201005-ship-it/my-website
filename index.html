<!DOCTYPE html>

<head>
    <meta charset="utf-8">
    <title>English Picture Game</title>
    <style>
        body {
            text-align: center;
            font-family: Arial;
            margin-top: 50px;
        }

        img {
            width: 300px;
            height: 300px;
            object-fit: cover;
        }

        input {
            padding: 10px;
            font-size: 18px;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div>
        <h1>Guess the English Word</h1>
        <img id="picture" src="apple.jpg">
        <br><br>
        <input type="text" id="answer" placeholder="Enter English word">
        <button onclick="checkAnswer()">Submit</button>
        <div id="message">
        </div>
        <script>
            const questions = [
                {
                    image: "apple.jpg",
                    answer: "apple"
                },
                {
                    image: "cat.jpg",
                    answer: "cat"
                },
                {
                    image: "dog.jpg",
                    answer: "dog"
                }
            ];

            let current = 0;

            function checkAnswer() {

                const userAnswer =
                    document.getElementById("answer")
                        .value
                        .toLowerCase()
                        .trim();

                if (userAnswer === questions[current].answer) {

                    document.getElementById("message").innerHTML =
                        "✅ Correct!";

                    current++;

                    if (current < questions.length) {

                        setTimeout(() => {

                            document.getElementById("picture").src =
                                questions[current].image;

                            document.getElementById("answer").addEventListener("keypress", function (event) {
                                if (event.key === "Enter") {
                                    checkAnswer();
                                }
                            });

                            document.getElementById("message").innerHTML = "";

                        }, 1000);

                    } else {

                        document.getElementById("message").innerHTML =
                            "🎉 You Win!";
                    }

                } else {

                    document.getElementById("message").innerHTML =
                        "❌ Try Again!";
                    document.getElementById("answer").value = "";
                }
            }
        </script>
    </div>

</body>

</html>
